# On every pull request: run the tests.
# On every push to main: run the tests, and if they pass, deploy to AWS.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button, e.g. for the very first deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B verify

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type-check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; queue them instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets GitHub sign the OIDC token that AWS exchanges for temporary credentials
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      OPS_BUCKET: ${{ vars.OPS_BUCKET }}
      SERVER_INSTANCE_ID: ${{ vars.SERVER_INSTANCE_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deploy files
        run: aws s3 sync deploy/ "s3://$OPS_BUCKET/deploy/" --delete

      - name: Deploy on the server (via AWS Systems Manager)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$SERVER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/usr/local/bin/foodpassport-deploy $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Poll until the command finishes (up to 10 minutes).
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$SERVER_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$SERVER_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          test "$status" = "Success"

      - name: Check the site is up
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://$SITE_DOMAIN/" | grep -q 'id="root"'; then
              echo "https://$SITE_DOMAIN is serving the app"
              exit 0
            fi
            sleep 10
          done
          echo "Site did not respond in time" >&2
          exit 1
