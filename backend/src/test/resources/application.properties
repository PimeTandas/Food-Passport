# Tests use an in-memory H2 database pretending to be PostgreSQL, so they need no Docker.
spring.datasource.url=jdbc:h2:mem:foodpassport;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
foodpassport.jwt.secret=test-secret-test-secret-test-secret-test-secret
foodpassport.jwt.ttl=PT1H
foodpassport.storage.type=local
foodpassport.storage.local-dir=${java.io.tmpdir}/foodpassport-test-uploads
