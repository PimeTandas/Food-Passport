spring.application.name=food-passport

# PostgreSQL - start one locally with `docker compose up -d` (see compose.yaml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodpassport}
spring.datasource.username=${DB_USER:foodpassport}
spring.datasource.password=${DB_PASSWORD:foodpassport}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors come back as RFC 9457 "problem details" JSON
spring.mvc.problemdetails.enabled=true

# Photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Secret used to sign login tokens (HS256, at least 32 bytes). ALWAYS override in production.
foodpassport.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
foodpassport.jwt.ttl=PT24H

# Photo storage: "local" (folder on disk, for development) or "s3"
foodpassport.storage.type=${STORAGE_TYPE:local}
foodpassport.storage.local-dir=${STORAGE_LOCAL_DIR:./uploads}
# AWS credentials come from the standard chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, ~/.aws, IAM role)
foodpassport.storage.s3.bucket=${S3_BUCKET:}
foodpassport.storage.s3.region=${AWS_REGION:eu-west-1}
