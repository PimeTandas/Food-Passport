spring.application.name=food-passport

# In-memory H2 database. Data disappears when the app stops - fine for step 1.
spring.datasource.url=jdbc:h2:mem:foodpassport
spring.jpa.hibernate.ddl-auto=create-drop

# Browse the DB at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password)
spring.h2.console.enabled=true
